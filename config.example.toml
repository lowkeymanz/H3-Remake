# H3-Remake 配置模板。
# 复制为 config.toml 后按需修改（config.toml 已被 git 忽略）；install.py、models.py 与 start.py 读取 config.toml，
# 文件缺失时按本模板默认值运行。config.toml 的生成引导属阶段 7（后续里程碑），当前可手动复制。

[comfyui]
# ComfyUI 来源（阶段 4）：
#   bundled  安装器将 ComfyUI v0.42.0 克隆到项目内 vendor/ComfyUI/ 并建独立 venv（默认，环境可控）
#   external 使用 path 指定的已有 ComfyUI：仅校验版本与 venv，节点装进它的 custom_nodes/，模型由 models.py 下载到它的 models/
#   auto     探测 path 与常见位置（~/ComfyUI、/opt/ComfyUI），确认后按 external 使用；否则回落 bundled
mode = "bundled"
# external/auto 模式下已有 ComfyUI 的根目录（含 main.py）
path = ""

[paths]
# REMAKE_HOME：会话/队列/心跳目录（MCP 与 worker 共用）。
# 设置后优先于 REMAKE_HOME 环境变量；默认 ~/.viggle-remake；云平台建议指向数据盘。
# remake_home = "/data/viggle-remake"

[worker]
# comfy_worker 参数（入口脚本按 [models].profile 选择，int8 = remake_worker.py）；阶段 9 的 start.py 以 ComfyUI venv 的 python 启动并守护。
gpu = 0
# 各档单窗最长帧数（帧数恒为 17n+5）：832x480 默认 345，1280x736 默认 175（需求定稿：--max-736 175）
max_480 = 345
max_736 = 175
# 追加在 `--` 之后透传给 ComfyUI 的参数（remake_worker.py 已内置 --vram-headroom 4，后写的覆盖）
# comfy_flags = ["--vram-headroom", "6"]

[models]
# 模型档位（组件级注册表，见 scripts/models.py）：int8 = 当前定稿档（32GB 显存级消费卡设计）。
# GGUF 等档位预留：注册新条目后改本键即可切换；TE/VAE 为跨档位共享组件，切档只补下载 diffusion 主模型差分。
# 模型下载为独立入口 models.py（与 install.py 环境部署分离）；worker 启动读同一档位选择执行入口。
profile = "int8"

[llm]
# 多模态 LLM（M1.3 定版：阿里云百炼 qwen3.7-plus）。阶段 7 引导填写；
# M3.1 起由 agent 层读取（Hermes model 三键 + .env 配对）。
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = ""
model = "qwen3.7-plus"

[painter]
# 关键帧绘制（M1.2 定版：MiniMax-H3-Image，OpenAI 兼容 images API）。阶段 7 引导填写；
# M3.1 起由 agent 层读取（Hermes 注册条目的 env 三元组，透传给 viggle-remake-mcp）。
base_url = "https://api.minimax.cn/v1"
api_key = ""
model = "MiniMax-H3-Image"

[agent]
# 单轮 agent 子进程超时（秒）：真实渲染单 take 分钟至数十分钟级、多窗会话可达小时级；
# 超时由看门狗终止该轮并凭恢复提示续跑（max_rounds 耗尽裁决 failed）。
round_timeout = 7200

[budget]
# 预算护栏（REMAKE_MAX_IMAGES / REMAKE_MAX_USD 与 per-session paint_limit 的默认值）。
# max_images 由 M5.3 设置页读写（任务创建表单预算预填）；max_usd 暂未读取。
# max_images = 200
# max_usd = 20.0
